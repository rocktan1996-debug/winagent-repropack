name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install --cache-dir .cache/pip -e ".[dev]"
      - name: Prepare test and report directories
        run: python -c "from pathlib import Path; Path('.tmp').mkdir(exist_ok=True); Path('artifacts').mkdir(exist_ok=True)"
      - name: Test
        run: python -m pytest -q --cov=winagent_repropack --cov-branch --cov-report=term-missing --cov-fail-under=85 --basetemp=.tmp/pytest -o cache_dir=.cache/pytest
      - name: Lint
        run: python -m ruff check .
      - name: Dependency consistency
        run: python -m pip check
      - name: Build sdist and wheel
        run: python -m build --outdir artifacts/dist
      - name: Verify clean-wheel synthetic demo and no-overwrite behavior
        run: python tools/verify_wheel_demo.py --wheel-dir artifacts/dist
