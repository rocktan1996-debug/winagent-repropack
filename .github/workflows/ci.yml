name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install --cache-dir .cache/pip -e ".[dev]"
      - name: Test
        run: python -m pytest -q --cov=winagent_repropack --cov-branch --cov-report=term-missing --cov-fail-under=85 --basetemp=.tmp/pytest -o cache_dir=.cache/pytest
      - name: Lint
        run: python -m ruff check .
      - name: Dependency consistency
        run: python -m pip check
      - name: Build sdist and wheel
        run: python -m build --outdir artifacts/dist
      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps --no-index --find-links artifacts/dist winagent-repropack==0.1.0rc1
      - name: CLI help
        run: repropack --help
      - name: CLI version
        run: repropack --version
      - name: Markdown smoke from synthetic input
        run: repropack analyze --log examples/synthetic.log --output artifacts/ci-issue.md
      - name: JSON smoke with synthetic Doctor
        run: repropack analyze --log examples/synthetic.log --doctor-json examples/synthetic-doctor-v1.json --output artifacts/ci-report.json --format json
