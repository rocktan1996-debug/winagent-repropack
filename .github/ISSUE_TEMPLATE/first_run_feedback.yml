name: "First-run feedback (synthetic only)"
description: "Report actual installation experience without exposing private data."
title: "[First-run] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying the public pre-release. Use examples/synthetic.log.
        Do not upload personal logs, account data, credentials or unreviewed reports.
        Security concerns belong in private vulnerability reporting.
  - type: input
    id: release
    attributes:
      label: Version tested
      placeholder: v0.1.0rc1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Ubuntu / Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Synthetic example outcome
      options:
        - Installed and generated a report
        - Installed but report generation failed
        - Installation failed
        - Not yet run / instructions unclear
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked or was confusing?
      description: No unreviewed logs, private paths, screenshots or tokens.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety confirmation
      options:
        - label: "My public report contains no sensitive user data or real diagnostic logs."
          required: true
